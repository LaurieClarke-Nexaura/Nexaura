<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexaura | Performance is Designed</title>
  <meta name="description" content="Nexaura is a performance design company. Potential is Common. Performance is Designed." />
  <style>
    :root {
      --navy:#0d2430;
      --navy2:#102f3c;
      --teal:#69c7c2;
      --text:#f5f7f7;
      --muted:#c8d2d5;
      --line:rgba(255,255,255,.16);
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body {
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 8%, rgba(105,199,194,.08), transparent 30%),
        linear-gradient(180deg,var(--navy2),var(--navy));
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 24px;
    }
    main {
      width:min(940px,100%);
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .logo {
      width:min(410px,82vw);
      height:auto;
      display:block;
      margin:0 auto 52px;
    }
    .rule {
      width:64px;
      height:2px;
      background:var(--teal);
      margin:0 auto 30px;
      border-radius:2px;
    }
    h1 {
      margin:0;
      font-size:clamp(42px,7vw,76px);
      line-height:1.02;
      font-weight:500;
      letter-spacing:-.04em;
      max-width:900px;
    }
    h1 span { display:block; }
    h1 .accent { color:var(--teal); }
    .intro {
      margin:30px auto 0;
      max-width:710px;
      font-size:clamp(18px,2.3vw,23px);
      line-height:1.55;
      color:var(--muted);
      font-weight:350;
    }
    .coming {
      margin:46px 0 0;
      padding-top:26px;
      border-top:1px solid var(--line);
      width:min(520px,100%);
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:12px;
      color:#e8eeee;
    }
    .link {
      margin-top:24px;
      display:inline-block;
      color:var(--text);
      text-decoration:none;
      font-size:15px;
      border-bottom:1px solid rgba(105,199,194,.75);
      padding-bottom:5px;
      transition:opacity .2s ease;
    }
    .link:hover { opacity:.72; }
    footer {
      margin-top:58px;
      font-size:12px;
      color:rgba(245,247,247,.52);
    }
    @media (max-width:600px) {
      body { padding:28px 20px; }
      .logo { margin-bottom:42px; width:min(340px,86vw); }
      .intro { margin-top:24px; }
      .coming { margin-top:38px; }
      footer { margin-top:44px; }
    }
  </style>
</head>
